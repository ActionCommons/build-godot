name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Job 1: Unit Tests & 100% Coverage Verification
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # Job 1b: Mutation Testing (non-blocking; reports how many injected bugs the
  # unit tests catch, since line coverage is already at 100%)
  mutation-test:
    name: Mutation Tests
    runs-on: ubuntu-latest
    needs: test-typescript
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Stryker
        run: npm run test:mutation

      - name: Upload Mutation Report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14

  # Job 2: Integration Tests
  test-action:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.runner }}
    needs: test-typescript
    strategy:
      fail-fast: false
      matrix:
        config:
          # Linux build jobs are pinned to ubuntu-24.04: on the ubuntu-26.04 image
          # (ubuntu-latest since late 2026) the Godot 4.5/4.6 link step fails with
          # undefined references to embree::BVHN<4> in the raycast module.

          # 1. Standard Linux Editor Build (Baseline)
          - name: Linux Editor
            runner: ubuntu-24.04
            platform: linuxbsd
            target: editor
            version: '4.5'

          # 2. Multi-Target Build (Verifies array parsing), Pre-release Flavor
          - name: Multi-Target (Linux) Pre-release
            runner: ubuntu-24.04
            platform: linuxbsd
            target: 'template_debug, template_release'
            version: '4.6'
            flavor: 'dev6'

          # 3. Godot 3.x build (verifies major-version detection, 4.x -> 3.x
          #    input translation and the pinned SCons install). Bounded by a
          #    timeout so CI only checks that the translated SCons invocation
          #    configures and starts compiling. Unlike 4.x, the Godot 3.x x11
          #    platform needs the X11/GL/audio development headers installed.
          - name: Godot 3.x Linux Editor
            runner: ubuntu-24.04
            apt_packages: >-
              libx11-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev
              libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev
              libudev-dev
            platform: linuxbsd
            target: editor
            version: '3.6'
            architecture: x86_64
            timeout: '120' # 2 minutes

          # 4. Multi-Target Header Archive Generation, Custom Directory & Timeout
          #    iOS requires macOS — the SCons platform detector only exposes
          #    "ios" when running on a Darwin host.
          - name: Multi-Target iOS Header Generation with Custom Path & Timeout
            runner: macos-latest
            platform: ios
            target: 'template_debug, template_release'
            version: '4.6.1'
            directory: './custom_godot_source'
            timeout: '40' # 40 seconds
            options: 'create_header_archive'

          # 5. Godot 4.x on Windows (verifies pip3/SCons/tar on a Windows host).
          - name: Windows Template 4.x
            runner: windows-latest
            platform: windows
            target: template_release
            version: '4.5'
            architecture: x86_64
            timeout: '120' # 2 minutes

          # 6. Godot 3.x macOS template (verifies macos -> osx translation and
          #    arch=arm64 against real SCons).
          - name: Godot 3.x macOS Template
            runner: macos-latest
            platform: macos
            target: template_release
            version: '3.6'
            architecture: arm64
            timeout: '120' # 2 minutes

          # 7. Godot 3.x iOS template (verifies ios -> iphone translation). A
          #    separate job because the timeout covers the whole run, so a
          #    second platform in the same job would never start.
          - name: Godot 3.x iOS Template
            runner: macos-latest
            platform: ios
            target: template_release
            version: '3.6'
            architecture: arm64
            timeout: '120' # 2 minutes

          # 8. Failure path: an input that is invalid for Godot 3.x must fail
          #    the step before anything is downloaded.
          - name: Godot 3.x Invalid Input Fails
            runner: ubuntu-latest
            platform: macos
            target: template_release
            version: '3.6'
            options: 'generate_bundle=yes'
            expect_failure: true

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Install System Dependencies
        if: ${{ matrix.config.apt_packages }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.config.apt_packages }}

      - name: Run Godot Build Action
        id: build
        uses: ./
        continue-on-error: ${{ matrix.config.expect_failure == true }}
        with:
          version: ${{ matrix.config.version }}
          platform: ${{ matrix.config.platform }}
          target: ${{ matrix.config.target }}
          flavor: ${{ matrix.config.flavor || 'stable' }}
          architecture: ${{ matrix.config.architecture || 'auto' }}
          options: ${{ matrix.config.options || '' }}
          directory: ${{ matrix.config.directory || '' }}
          timeout: ${{ matrix.config.timeout || '0' }}

      - name: Verify Expected Failure
        if: ${{ matrix.config.expect_failure == true }}
        shell: bash
        run: |
          if [[ "${{ steps.build.outcome }}" != "failure" ]]; then
            echo "::error::Expected the action to fail, got: ${{ steps.build.outcome }}"
            exit 1
          fi
          if [[ -n "${{ steps.build.outputs.directory }}" ]]; then
            echo "::error::Validation failure must happen before the directory output is set"
            exit 1
          fi
          echo "Action failed as expected."

      # Checks the outputs instead of only printing them: the working
      # directory must exist and contain the extracted source tree; a build
      # without a timeout must have produced a binary; a requested header
      # archive must be a non-empty, valid ZIP.
      - name: Verify Output
        if: ${{ matrix.config.expect_failure != true }}
        shell: bash
        env:
          BUILD_DIR: ${{ steps.build.outputs.directory }}
          HEADER_ARCHIVE: ${{ steps.build.outputs.header_archive }}
          BUILD_TIMEOUT: ${{ matrix.config.timeout || '0' }}
          BUILD_OPTIONS: ${{ matrix.config.options || '' }}
        run: |
          set -euo pipefail
          echo "Build directory: $BUILD_DIR"
          [[ -n "$BUILD_DIR" && -d "$BUILD_DIR" ]] \
            || { echo "::error::directory output is missing or not a directory"; exit 1; }

          source_dirs=("$BUILD_DIR"/godot-*/)
          [[ ${#source_dirs[@]} -eq 1 && -f "${source_dirs[0]}SConstruct" ]] \
            || { echo "::error::expected exactly one extracted godot-* source tree in $BUILD_DIR"; ls -la "$BUILD_DIR"; exit 1; }
          src="${source_dirs[0]}"
          echo "Source tree: $src"

          if [[ "$BUILD_TIMEOUT" == "0" ]]; then
            # Untimed builds must finish and leave a binary behind.
            binaries=("$src"bin/godot.*)
            [[ -e "${binaries[0]}" ]] \
              || { echo "::error::no bin/godot.* binary was produced"; ls -la "$src"bin 2>/dev/null; exit 1; }
            echo "Binaries:"; ls -la "${binaries[@]}"
          else
            echo "Timed build (timeout ${BUILD_TIMEOUT}s): only checking that SCons started."
            # Both majors generate *.gen.h files and object files early on.
            started=$(find "$src" \( -name '*.gen.h' -o -name '*.o' -o -name '*.obj' \) -print -quit)
            [[ -n "$started" ]] \
              || { echo "::error::SCons does not appear to have started in $src"; exit 1; }
            echo "SCons started (found $started)."
          fi

          if [[ "$BUILD_OPTIONS" == *create_header_archive* ]]; then
            echo "Header archive: $HEADER_ARCHIVE"
            [[ -n "$HEADER_ARCHIVE" && -s "$HEADER_ARCHIVE" ]] \
              || { echo "::error::header_archive output is missing or empty"; exit 1; }
            python3 - "$HEADER_ARCHIVE" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              bad = z.testzip()
              names = z.namelist()
          assert bad is None, f"corrupt entry: {bad}"
          assert names, "archive is empty"
          assert all(n.endswith(('.glsl', '.h', '.hh', '.hpp', '.inc', '.inl')) for n in names), "non-header entry in archive"
          print(f"Header archive OK: {len(names)} entries")
          PY
          else
            [[ -z "$HEADER_ARCHIVE" ]] \
              || { echo "::error::header_archive was set without create_header_archive"; exit 1; }
          fi
